# App-owned bounded Rime adapter schema. Dictionary: iDvel/rime-ice (GPL-3.0).
schema:
  schema_id: rime_ice_private
  name: 雾凇全拼
  version: '0.8.1'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
translator:
  dictionary: rime_ice
  prism: rime_ice
  enable_user_dict: false
  enable_sentence: true
  spelling_hints: 8
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
key_binder:
  bindings:
    - {when: has_menu, accept: Page_Up, send: Page_Up}
    - {when: has_menu, accept: Page_Down, send: Page_Down}
