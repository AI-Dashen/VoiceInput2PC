name: Windows v0.7 build
on:
  push:
    branches: [feature/universal-input-v07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Python build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Build Windows bundle with pinned official Tailcat
        shell: pwsh
        run: .\scripts\build_windows_release.ps1 -Version 0.7.0 -FetchTailcat
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput2PC-Windows-v0.7.0
          path: release/output/windows-v0.7.0/*
          if-no-files-found: error
