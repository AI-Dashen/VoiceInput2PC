<svg viewBox="0 0 820 340" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- 背景定义 -->
  <rect width="820" height="340" fill="#EAECEB" rx="8"/>
  
  <!-- ================= 态1：语音侧边Dock态 (含远端草稿微泡) ================= -->
  <g transform="translate(15, 15)">
    <rect width="240" height="310" fill="#FFFFFF" stroke="#DCE2DF" rx="12"/>
    <text x="14" y="26" fill="#68736E" font-size="11" font-weight="bold">1. 侧边Dock态 (本机直上屏 / 远端单行草稿)</text>
    <!-- 模拟宿主App输入框 -->
    <rect x="14" y="45" width="212" height="36" fill="#F4F6F5" stroke="#DCE2DF" rx="6"/>
    <text x="24" y="68" fill="#1C2421" font-size="12">宿主App光标直出文字|</text>
    
    <!-- 远端模式下的左延单行草稿条 (仅选PC时显现) -->
    <rect x="14" y="146" width="154" height="44" fill="#F4F6F5" stroke="#1B4D3E" stroke-width="1.2" rx="10"/>
    <text x="22" y="164" fill="#1B4D3E" font-size="10" font-weight="bold">发往 MacBook [✓已达]</text>
    <text x="22" y="180" fill="#1C2421" font-size="11">刚才口述的跨端草稿内容...</text>

    <!-- 侧边小Dock主体 (56x148dp映射) -->
    <rect x="176" y="110" width="52" height="142" fill="#F4F6F5" stroke="#DCE2DF" stroke-width="1.5" rx="26"/>
    <!-- 目标切换胶囊 -->
    <rect x="182" y="118" width="40" height="24" fill="#E6F0EC" rx="12"/>
    <text x="202" y="134" fill="#1B4D3E" font-size="10" font-weight="bold" text-anchor="middle">本机</text>
    <!-- 语音主按键 (墨绿, 适中尺寸) -->
    <circle cx="202" cy="176" r="22" fill="#1B4D3E"/>
    <text x="202" y="180" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">语音</text>
    <!-- 底部双小键：菜单 与 键盘 -->
    <circle cx="190" cy="230" r="11" fill="#FFFFFF" stroke="#DCE2DF"/>
    <text x="190" y="234" fill="#1C2421" font-size="11" text-anchor="middle">≡</text>
    <circle cx="214" cy="230" r="11" fill="#FFFFFF" stroke="#DCE2DF"/>
    <text x="214" y="234" fill="#1C2421" font-size="10" text-anchor="middle">⌨</text>
  </g>

  <!-- ================= 态2：26键展开态 (含顶部数字行与目标键) ================= -->
  <g transform="translate(275, 15)">
    <rect width="260" height="310" fill="#FFFFFF" stroke="#DCE2DF" rx="12"/>
    <text x="14" y="26" fill="#68736E" font-size="11" font-weight="bold">2. 26键展开态 (隐藏侧边，带独立数字行)</text>
    
    <!-- 远端草稿驻留条 (仅选PC时悬浮于键盘顶) -->
    <rect x="8" y="88" width="244" height="28" fill="#E6F0EC" rx="6"/>
    <text x="16" y="106" fill="#1B4D3E" font-size="11">草稿: 跨端文字暂存 |</text>
    <text x="205" y="106" fill="#C93B2B" font-size="10" font-weight="bold">!断连保留</text>

    <!-- 键盘主底板 -->
    <rect x="0" y="122" width="260" height="188" fill="#F4F6F5" rx="8"/>
    <!-- 顶部工具栏 38dp -->
    <rect x="8" y="127" width="28" height="24" fill="#FFFFFF" stroke="#DCE2DF" rx="5"/>
    <text x="22" y="143" fill="#1C2421" font-size="12" text-anchor="middle">≡</text>
    <rect x="42" y="127" width="96" height="24" fill="#E6F0EC" stroke="#1B4D3E" rx="12"/>
    <text x="90" y="143" fill="#1B4D3E" font-size="10" font-weight="bold" text-anchor="middle">目标: MacBook</text>
    <rect x="196" y="127" width="56" height="24" fill="#1B4D3E" rx="12"/>
    <text x="224" y="143" fill="#FFFFFF" font-size="10" text-anchor="middle">语音Dock</text>

    <!-- 独立数字行 -->
    <g transform="translate(6, 156)" fill="#FFFFFF" stroke="#DCE2DF" font-size="10" text-anchor="middle">
      <rect x="0" y="0" width="22" height="24" rx="4"/><text x="11" y="16" fill="#1C2421" stroke="none">1</text>
      <rect x="25" y="0" width="22" height="24" rx="4"/><text x="36" y="16" fill="#1C2421" stroke="none">2</text>
      <rect x="50" y="0" width="22" height="24" rx="4"/><text x="61" y="16" fill="#1C2421" stroke="none">3</text>
      <rect x="75" y="0" width="22" height="24" rx="4"/><text x="86" y="16" fill="#1C2421" stroke="none">4</text>
      <rect x="100" y="0" width="22" height="24" rx="4"/><text x="111" y="16" fill="#1C2421" stroke="none">5</text>
      <rect x="125" y="0" width="22" height="24" rx="4"/><text x="136" y="16" fill="#1C2421" stroke="none">6</text>
      <rect x="150" y="0" width="22" height="24" rx="4"/><text x="161" y="16" fill="#1C2421" stroke="none">7</text>
      <rect x="175" y="0" width="22" height="24" rx="4"/><text x="186" y="16" fill="#1C2421" stroke="none">8</text>
      <rect x="200" y="0" width="22" height="24" rx="4"/><text x="211" y="16" fill="#1C2421" stroke="none">9</text>
      <rect x="225" y="0" width="22" height="24" rx="4"/><text x="236" y="16" fill="#1C2421" stroke="none">0</text>
    </g>

    <!-- QWERTY三行示意 -->
    <rect x="6" y="185" width="248" height="28" fill="#FFFFFF" stroke="#DCE2DF" rx="4"/>
    <text x="130" y="203" fill="#1C2421" font-size="11" letter-spacing="7" text-anchor="middle">QWERTYUIOP</text>
    <rect x="16" y="218" width="228" height="28" fill="#FFFFFF" stroke="#DCE2DF" rx="4"/>
    <text x="130" y="236" fill="#1C2421" font-size="11" letter-spacing="7" text-anchor="middle">ASDFGHJKL</text>
    <rect x="6" y="251" width="34" height="26" fill="#E6F0EC" rx="4"/>
    <text x="23" y="268" fill="#1B4D3E" font-size="10" text-anchor="middle">⇧</text>
    <rect x="44" y="251" width="172" height="26" fill="#FFFFFF" stroke="#DCE2DF" rx="4"/>
    <text x="130" y="268" fill="#1C2421" font-size="11" letter-spacing="6" text-anchor="middle">ZXCVBNM</text>
    <rect x="220" y="251" width="34" height="26" fill="#E6F0EC" rx="4"/>
    <text x="237" y="268" fill="#1B4D3E" font-size="10" text-anchor="middle">⌫</text>

    <!-- 底栏：符号层(无九宫格) + 空格 + 回车 -->
    <rect x="6" y="281" width="54" height="24" fill="#E6F0EC" rx="4"/>
    <text x="33" y="297" fill="#1B4D3E" font-size="10" font-weight="bold" text-anchor="middle">#+= 符号</text>
    <rect x="64" y="281" width="132" height="24" fill="#FFFFFF" stroke="#DCE2DF" rx="4"/>
    <text x="130" y="297" fill="#68736E" font-size="10" text-anchor="middle">空格</text>
    <rect x="200" y="281" width="54" height="24" fill="#1B4D3E" rx="4"/>
    <text x="227" y="297" fill="#FFFFFF" font-size="10" text-anchor="middle">发送/回车</text>
  </g>

  <!-- ================= 态3：功能菜单态 (收敛记录/统计/设置) ================= -->
  <g transform="translate(555, 15)">
    <rect width="250" height="310" fill="#FFFFFF" stroke="#DCE2DF" rx="12"/>
    <text x="14" y="26" fill="#68736E" font-size="11" font-weight="bold">3. 功能菜单态 (点击 ≡ 展开面板)</text>
    
    <rect x="0" y="122" width="250" height="188" fill="#F4F6F5" rx="8"/>
    <!-- 顶部返回条 -->
    <rect x="8" y="128" width="52" height="24" fill="#FFFFFF" stroke="#DCE2DF" rx="5"/>
    <text x="34" y="144" fill="#1B4D3E" font-size="10" font-weight="bold" text-anchor="middle">← 返回</text>
    <text x="130" y="144" fill="#1C2421" font-size="11" font-weight="bold" text-anchor="middle">功能与跨端中心</text>

    <!-- 卡片网格收纳低频项 -->
    <rect x="12" y="160" width="226" height="42" fill="#FFFFFF" stroke="#DCE2DF" rx="6"/>
    <text x="22" y="178" fill="#1B4D3E" font-size="11" font-weight="bold">跨端历史与未发草稿库 (2)</text>
    <text x="22" y="194" fill="#68736E" font-size="10">查看PC回执状态、重发断连滞留文本</text>

    <rect x="12" y="208" width="109" height="44" fill="#FFFFFF" stroke="#DCE2DF" rx="6"/>
    <text x="22" y="226" fill="#1C2421" font-size="11" font-weight="bold">输入统计</text>
    <text x="22" y="242" fill="#1B4D3E" font-size="10">今日 3,420 字</text>

    <rect x="129" y="208" width="109" height="44" fill="#FFFFFF" stroke="#DCE2DF" rx="6"/>
    <text x="139" y="226" fill="#1C2421" font-size="11" font-weight="bold">配对设备管理</text>
    <text x="139" y="242" fill="#68736E" font-size="10">MacBook (已连)</text>

    <rect x="12" y="258" width="226" height="38" fill="#FFFFFF" stroke="#DCE2DF" rx="6"/>
    <text x="22" y="281" fill="#1C2421" font-size="11" font-weight="bold">引擎与键盘设置 (本地ASR模型 / 震动)</text>
  </g>
</svg>