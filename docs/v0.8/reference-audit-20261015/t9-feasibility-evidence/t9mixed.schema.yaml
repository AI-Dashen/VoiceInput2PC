# App-owned numeric Rime spelling adapter, based on official Rime alphabet algebra.
schema:
  schema_id: t9mixed
  name: 雾凇九宫格
  version: '0.8.1'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]
speller:
  alphabet: 'abcdefghijklmnopqrstuvwxyz23456789'
  initials: 'abcdefghijklmnopqrstuvwxyz23456789'
  delimiter: " '"
  algebra:
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[ghi]/4/
    - derive/[jkl]/5/
    - derive/[mno]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/
translator:
  dictionary: rime_ice
  prism: t9mixed
  enable_user_dict: true
  enable_sentence: true
  spelling_hints: 8
key_binder:
  bindings:
    - {when: has_menu, accept: Page_Up, send: Page_Up}
    - {when: has_menu, accept: Page_Down, send: Page_Down}
