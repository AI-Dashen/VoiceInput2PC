plugins { id 'com.android.application' }

def signingNames = [
    'VOICEINPUT2PC_KEYSTORE',
    'VOICEINPUT2PC_STORE_PASSWORD',
    'VOICEINPUT2PC_KEY_ALIAS',
    'VOICEINPUT2PC_KEY_PASSWORD'
]
def signingValues = signingNames.collectEntries { [(it): System.getenv(it)] }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested) {
    def missing = signingNames.findAll { !signingValues[it] }
    if (!missing.isEmpty()) {
        throw new GradleException('Missing release signing environment: ' + missing.join(', '))
    }
}

android {
    namespace 'io.github.amxooo.voiceinput2pc'
    compileSdk 36
    buildToolsVersion "36.0.0"
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    defaultConfig {
        applicationId 'io.github.amxooo.voiceinput2pc'
        minSdk 26
        targetSdk 35
        versionCode 46
        versionName '0.8.36-stable-memory'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    aaptOptions { noCompress "flute", "mnn", "weight", "bin", "txt" }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (signingNames.every { signingValues[it] }) {
                storeFile file(signingValues['VOICEINPUT2PC_KEYSTORE'])
                storePassword signingValues['VOICEINPUT2PC_STORE_PASSWORD']
                keyAlias signingValues['VOICEINPUT2PC_KEY_ALIAS']
                keyPassword signingValues['VOICEINPUT2PC_KEY_PASSWORD']
            }
        }
    }
    sourceSets.main.assets.exclude("pairing.json")
    buildTypes {
        debug {
            applicationIdSuffix providers.gradleProperty("qaPackageSuffix").getOrElse("")
            resValue 'string', 'app_name', '万能输入法'
        }
        release {
            resValue 'string', 'app_name', '万能输入法'
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}


dependencies {
    implementation files('libs/tailcatbridge.aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
}

// Reflection-based bridge calls do not produce javac missing-class errors.
// Refuse to ship an APK that silently lost the cross-network runtime.
tasks.matching { it.name == 'preBuild' }.configureEach {
    doFirst {
        if (!file('libs/tailcatbridge.aar').isFile()) {
            throw new GradleException('Tailcat bridge missing: build or restore trusted tailcatbridge.aar before packaging')
        }
    }
}
